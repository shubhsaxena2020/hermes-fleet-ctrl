name: CI

# Runs on every push and every PR. No secrets/credentials — the repo's
# no-secret posture is preserved (see BACKLOG.md Phase A, item A2).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [master]

# Locked-down defaults: no token escalation, read-only checkout.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck / Lint / Test / Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # tmux is required by the integration tests (real-daemon, discovery.real,
    # local-tmux) which drive a real tmux server on an isolated socket.
    strategy:
      fail-fast: false
      matrix:
        # NOTE: Node 18 is intentionally excluded. package.json pins
        # `engines.node >= 20` and the native modules (better-sqlite3@11,
        # node-pty@1) ship prebuilds only for Node 20+. Adding 18 would fail
        # the install/build step. Drop this comment if 18 support is added.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # Non-blocking: the deterministic mock-fleet integration harness (T15) runs as
  # its own job so a flake there never reds the required gate. It is pure/in-memory
  # (no tmux), so it does not need the tmux install step.
  integration-mock:
    name: Mock-fleet integration harness (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run mock-fleet integration harness
        run: pnpm exec vitest run src/test/mock-fleet.integration.test.ts
